name: Stock Picker Automation

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  run-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install tushare pandas numpy

      - name: Run strategy 1
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: |
          python -c "
          from stock_picker_tushare import run_picker, save_results
          result = run_picker(max_results=10)
          save_results(result, 'data/strategy1.json')
          print('选股完成')
          "

      - name: Commit results
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add data/
          git diff --staged --quiet || git commit -m "Update stock data $(date -u)"
          git push
